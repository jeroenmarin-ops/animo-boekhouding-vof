<style>

<script>
const SB_URL='https://ttmfrmnaiqlceqkeidym.supabase.co';const SB_KEY='sb_publishable_iE0-RWlfo00PNUfj9N8FrA_PzQA74U_';const sb=supabase.createClient(SB_URL,SB_KEY);pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const NAV=[['dashboard','▦ Dashboard'],['sales','↗ Verkoop'],['purchases','↙ Aankopen'],['bank','▤ Bank & kas'],['accounting','▥ Boekhouding'],['vat','% Btw'],['partners','♙ Vennoten'],['peppol','⇄ Peppol extern'],['reports','◫ Rapporten'],['documents','▧ Documenten'],['settings','⚙ Instellingen']];let S={session:null,business:null,page:'dashboard',invoices:[],entries:[],lines:[],documents:[],partners:[],accounts:[],transactions:[],contacts:[]};const $=q=>document.querySelector(q),money=n=>new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR'}).format(Number(n||0));
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2600)}function show(id){['#auth','#setup','#app'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function modal(h){$('#modalBody').innerHTML=h;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
async function boot(){let {data}=await sb.auth.getSession();S.session=data.session;if(!S.session)return show('#auth');let r=await sb.from('business_users').select('business_id,role,businesses(*)').eq('user_id',S.session.user.id).limit(1).maybeSingle();if(r.error)return toast(r.error.message);if(!r.data)return show('#setup');S.business=r.data.businesses;show('#app');await loadAll()}
async function loadAll(){const b=S.business.id;const Q=await Promise.all([sb.from('invoices').select('*,contacts(name)').eq('business_id',b).order('invoice_date',{ascending:false}),sb.from('journal_entries').select('*').eq('business_id',b).order('booked_on',{ascending:false}),sb.from('documents').select('*').eq('business_id',b).is('deleted_at',null).order('created_at',{ascending:false}),sb.from('partners').select('*').eq('business_id',b),sb.from('accounts').select('*').eq('business_id',b).order('code'),sb.from('financial_transactions').select('*').eq('business_id',b).order('transaction_date',{ascending:false}),sb.from('contacts').select('*').eq('business_id',b).order('name')]);const err=Q.find(x=>x.error)?.error;if(err)return toast(err.message);[S.invoices,S.entries,S.documents,S.partners,S.accounts,S.transactions,S.contacts]=Q.map(x=>x.data||[]);render()}
function nav(){ $('#nav').innerHTML=NAV.map(x=>`<button data-page="${x[0]}" class="${S.page===x[0]?'active':''}">${x[1]}</button>`).join('')}
function render(){nav();let item=NAV.find(x=>x[0]===S.page);$('#title').textContent=item?item[1].replace(/^\S+\s/,''):'Dashboard';$('#content').innerHTML=V[S.page]();$('.side').classList.remove('open')}
const invs=d=>S.invoices.filter(x=>x.direction===d),sum=(arr,k)=>arr.reduce((a,x)=>a+Number(x[k]||0),0);function invTable(rows){if(!rows.length)return '<div class="empty">Nog geen facturen.</div>';return `<div class="table"><table><thead><tr><th>Nr.</th><th>Relatie</th><th>Datum</th><th>Status</th><th class="right">Totaal</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.invoice_number)}</b></td><td>${esc(x.contacts?.name||'Onbekend')}</td><td>${x.invoice_date}</td><td><span class="badge ${x.status}">${x.status}</span></td><td class="right">${money(x.total_amount)}</td><td><button class="btn secondary" data-view-doc="${x.id}">PDF</button>${x.status==='draft'?` <button class="btn danger" data-del-inv="${x.id}">Verwijder</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function dashboard(){let sa=invs('sale'),pu=invs('purchase'),rev=sum(sa,'net_amount'),cost=sum(pu,'net_amount'),vat=sum(sa,'vat_amount')-sum(pu,'vat_amount');return `<div class="note"><b>Live boekhouding</b><br>Facturen en bewijsstukken worden in je Supabase-database en privé-opslag bewaard.</div><div class="grid kpis"><div class="card kpi"><small>Verkoop excl. btw</small><b>${money(rev)}</b><span>${sa.length} facturen</span></div><div class="card kpi"><small>Aankopen excl. btw</small><b>${money(cost)}</b><span>${pu.length} facturen</span></div><div class="card kpi"><small>Resultaatindicatie</small><b>${money(rev-cost)}</b><span>voor afsluitingen</span></div><div class="card kpi"><small>Btw-indicatie</small><b>${money(vat)}</b><span>te controleren</span></div></div><div class="grid two" style="margin-top:15px"><div class="card"><div class="section"><h2>Recente facturen</h2><button class="btn" data-upload="sale">Upload verkoop</button></div>${invTable(S.invoices.slice(0,6))}</div><div class="card"><h2>Direct opvolgen</h2><div class="list-row"><span>Conceptfacturen</span><b>${S.invoices.filter(x=>x.status==='draft').length}</b></div><div class="list-row"><span>Journaalposten</span><b>${S.entries.length}</b></div><div class="list-row"><span>Documenten</span><b>${S.documents.length}</b></div></div></div>`}
function sales(){return `<div class="toolbar"><h2>Verkoopfacturen</h2><button class="btn" data-upload="sale">PDF uploaden</button></div><div class="card">${invTable(invs('sale'))}</div>`}function purchases(){return `<div class="toolbar"><h2>Aankoopfacturen</h2><button class="btn" data-upload="purchase">PDF uploaden</button></div><div class="card">${invTable(invs('purchase'))}</div>`}
function bank(){return `<div class="toolbar"><h2>Bank & kas</h2><button class="btn" data-bank>Transactie toevoegen</button></div><div class="card">${S.transactions.length?S.transactions.map(t=>`<div class="list-row"><div><b>${esc(t.description)}</b><div class="metric">${t.transaction_date}</div></div><b>${money(t.amount)}</b></div>`).join(''):'<div class="empty">Nog geen bank- of kastransacties.</div>'}</div>`}
function accounting(){return `<div class="toolbar"><h2>Dubbele boekhouding</h2><button class="btn" data-manual>Handmatige boeking</button></div><div class="card"><div class="section"><h2>Journaalposten</h2><span class="badge finalized">debet = credit</span></div>${S.entries.length?`<div class="table"><table><tr><th>Nr.</th><th>Datum</th><th>Omschrijving</th><th>Status</th></tr>${S.entries.map(e=>`<tr><td>${e.entry_number}</td><td>${e.booked_on}</td><td>${esc(e.description)}</td><td><span class="badge ${e.status}">${e.status}</span></td></tr>`).join('')}</table></div>`:'<div class="empty">Nog geen journaalposten.</div>'}</div>`}
function vat(){let sa=invs('sale'),pu=invs('purchase'),out=sum(sa,'vat_amount'),input=sum(pu,'vat_amount');return `<div class="grid kpis"><div class="card kpi"><small>Verschuldigde btw</small><b>${money(out)}</b></div><div class="card kpi"><small>Aftrekbare btw</small><b>${money(input)}</b></div><div class="card kpi"><small>Saldo</small><b>${money(out-input)}</b></div><div class="card kpi"><small>Controle</small><b>${S.invoices.filter(x=>x.status==='draft').length}</b><span>concepten</span></div></div><div class="card" style="margin-top:15px"><h2>Btw-detail per factuur</h2>${invTable(S.invoices)}</div>`}
function partners(){return `<div class="toolbar"><h2>Vennoten</h2><button class="btn" data-partner>Vennoot toevoegen</button></div><div class="grid two">${S.partners.length?S.partners.map(p=>`<div class="card"><h2>${esc(p.name)}</h2><p>Winstaandeel: <b>${p.profit_share}%</b></p><p>Rekening-courant: <b>${money(p.current_account)}</b></p></div>`).join(''):'<div class="card empty">Nog geen vennoten.</div>'}</div>`}
function peppol(){return `<div class="note"><b>Externe Peppol-verwerking</b><br>Deze app registreert je boekhouding. Verzenden en ontvangen via Peppol gebeurt in je externe facturatieprogramma.</div><div class="card"><h2>Externe referenties</h2>${S.invoices.filter(x=>x.external_reference).length?invTable(S.invoices.filter(x=>x.external_reference)):'<div class="empty">Nog geen externe Peppol-referenties.</div>'}</div>`}
function reports(){let sa=invs('sale'),pu=invs('purchase');return `<div class="grid two"><div class="card"><h2>Resultatenrekening indicatie</h2><div class="list-row"><span>Omzet</span><b>${money(sum(sa,'net_amount'))}</b></div><div class="list-row"><span>Kosten</span><b>${money(sum(pu,'net_amount'))}</b></div><div class="list-row"><span>Resultaat</span><b>${money(sum(sa,'net_amount')-sum(pu,'net_amount'))}</b></div></div><div class="card"><h2>Exports</h2><button class="btn" data-export>CSV facturen</button></div></div>`}
function documents(){return `<div class="toolbar"><h2>Documenten</h2><button class="btn" data-upload="other">PDF toevoegen</button></div><div class="card">${S.documents.length?S.documents.map(d=>`<div class="list-row"><div><b>${esc(d.file_name)}</b><div class="metric">${d.direction||d.document_type||''}</div></div><button class="btn secondary" data-open="${esc(d.storage_path)}">Open</button></div>`).join(''):'<div class="empty">Nog geen documenten.</div>'}</div>`}
function settings(){return `<div class="card"><h2>${esc(S.business.name)}</h2><p>Ondernemingsnummer: ${esc(S.business.enterprise_number||'-')}</p><p>Btw-nummer: ${esc(S.business.vat_number||'-')}</p><p>Supabase: verbonden</p></div>`}const V={dashboard,sales,purchases,bank,accounting,vat,partners,peppol,reports,documents,settings};
function uploadForm(direction){let label=direction==='sale'?'Verkoopfactuur':direction==='purchase'?'Aankoopfactuur':'Document';modal(`<h2>${label} als PDF uploaden</h2><form id="pdfForm" class="form" data-direction="${direction}"><label class="drop full">Kies PDF<input id="pdfFile" type="file" accept="application/pdf" required></label><div id="readStatus" class="note full">Selecteer een PDF. Alleen betrouwbare gegevens worden voorgesteld.</div><label>Relatie/naam<input name="relation" required></label><label>Factuurnummer<input name="number" required></label><label>Factuurdatum<input name="date" type="date" required></label><label>Vervaldatum<input name="due" type="date"></label><label>Exclusief btw<input name="net" type="number" step="0.01" min="0" required></label><label>Btw<input name="vat" type="number" step="0.01" min="0" required></label><label>Totaal<input name="total" type="number" step="0.01" min="0" required></label><label>Btw-tarief<select name="rate"><option>21</option><option>12</option><option>6</option><option>0</option></select></label><div id="amountCheck" class="full"></div><label class="full"><input name="confirm" type="checkbox" required style="width:auto"> Ik heb naam, datums en bedragen gecontroleerd.</label><button class="btn full">Opslaan en boeken</button></form>`)}
async function readPdf(file){const buf=new Uint8Array(await file.arrayBuffer()),pdf=await pdfjsLib.getDocument({data:buf}).promise;let out='';for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i),c=await p.getTextContent();out+='\n'+c.items.map(x=>x.str).join(' ')}return out.replace(/\s+/g,' ').trim()}
function parseNum(v){if(!v)return 0;let s=String(v).replace(/\s|€/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');return Number(s)||0}function amt(rx,t){let m=t.match(rx);return parseNum(m?.[1])}function iso(s){let m=s?.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(!m)return'';let y=+m[3];if(y<100)y+=2000;return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}
function extract(t,file){let number=t.match(/(?:factuur\s*(?:nr|nummer|#)|invoice\s*(?:no|number))\s*[:#-]?\s*([A-Z0-9\/_-]{2,})/i)?.[1]||file.name.replace(/\.pdf$/i,'');let date=iso(t.match(/(?:factuurdatum|invoice date)\s*[:\-]?\s*(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})/i)?.[1]);let due=iso(t.match(/(?:vervaldatum|due date)\s*[:\-]?\s*(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})/i)?.[1]);let total=amt(/(?:totaal\s*(?:te betalen|incl\.?\s*btw)?|grand total|total due)\s*[:€\s]*([0-9.\s]+[,\.]\d{2})/i,t);let vat=amt(/(?:btw bedrag|totaal btw|vat amount|total vat)\s*[:€\s]*([0-9.\s]+[,\.]\d{2})/i,t);let net=amt(/(?:exclusief btw|excl\.? btw|subtotaal|subtotal)\s*[:€\s]*([0-9.\s]+[,\.]\d{2})/i,t);if(!total&&net&&vat)total=net+vat;if(!net&&total&&vat)net=total-vat;return{number,date,due,total:+total.toFixed(2),vat:+vat.toFixed(2),net:+net.toFixed(2)}}
function checkAmounts(form){let n=+form.net.value||0,v=+form.vat.value||0,t=+form.total.value||0,d=Math.abs(n+v-t),el=$('#amountCheck');el.innerHTML=d<0.02?'<span class="ok">✓ Bedragen sluiten</span>':'<span class="warn">Exclusief + btw moet gelijk zijn aan totaal.</span>';return d<0.02}
async function onFile(file){if(!file||file.type!=='application/pdf')return toast('Kies een PDF');$('#readStatus').textContent='PDF wordt gelezen…';try{let t=await readPdf(file),x=extract(t,file),f=$('#pdfForm');f.number.value=x.number;f.date.value=x.date||new Date().toISOString().slice(0,10);f.due.value=x.due;f.net.value=x.net||'';f.vat.value=x.vat||'';f.total.value=x.total||'';f.relation.value='';$('#readStatus').textContent='PDF gelezen. Vul de relatie in en controleer de bedragen.';checkAmounts(f)}catch(e){$('#readStatus').textContent='PDF kon niet automatisch worden uitgelezen. Vul de velden in.'}}
async function savePdf(f){if(!checkAmounts(f))return toast('Bedragen sluiten niet');let file=$('#pdfFile').files[0],fd=new FormData(f),dir=f.dataset.direction,user=S.session.user.id,safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${user}/${S.business.id}/${dir}/${Date.now()}-${safe}`;f.querySelector('button').disabled=true;try{let up=await sb.storage.from('accounting-documents').upload(path,file,{contentType:'application/pdf'});if(up.error)throw up.error;let r=await sb.rpc('book_invoice_pdf',{p_business_id:S.business.id,p_direction:dir,p_relation_name:fd.get('relation'),p_invoice_number:fd.get('number'),p_invoice_date:fd.get('date'),p_due_date:fd.get('due')||null,p_net:+fd.get('net'),p_vat:+fd.get('vat'),p_total:+fd.get('total'),p_vat_rate:+fd.get('rate'),p_storage_path:path,p_file_name:file.name,p_file_size:file.size});if(r.error){await sb.storage.from('accounting-documents').remove([path]);throw r.error}closeModal();toast('PDF en boeking opgeslagen');await loadAll()}catch(e){toast(e.message)}finally{f.querySelector('button').disabled=false}}
async function openPath(path){let r=await sb.storage.from('accounting-documents').createSignedUrl(path,120);if(r.error)return toast(r.error.message);window.open(r.data.signedUrl,'_blank')}async function delInv(id){if(!confirm('Concept en gekoppeld document verwijderen?'))return;let r=await sb.rpc('delete_draft_invoice',{p_invoice_id:id});if(r.error)return toast(r.error.message);toast('Concept verwijderd');await loadAll()}
function exportCsv(){let rows=[['richting','nummer','datum','relatie','netto','btw','totaal','status'],...S.invoices.map(x=>[x.direction,x.invoice_number,x.invoice_date,x.contacts?.name||'',x.net_amount,x.vat_amount,x.total_amount,x.status])];let csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='facturen.csv';a.click()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error)return toast(r.error.message);location.reload()};$('#setupForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),y=+f.get('year'),c=await sb.rpc('create_my_business',{business_name:f.get('name'),business_enterprise_number:f.get('enterprise')||null,business_vat_number:f.get('vat')||null});if(c.error)return toast(c.error.message);let i=await sb.rpc('initialize_business_accounting',{target_business:c.data,fiscal_year_name:String(y),fiscal_year_start:`${y}-01-01`,fiscal_year_end:`${y}-12-31`});if(i.error)return toast(i.error.message);location.reload()};
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){S.page=p.dataset.page;render()}let u=e.target.closest('[data-upload]');if(u)uploadForm(u.dataset.upload);if(e.target.closest('[data-close]'))closeModal();let o=e.target.closest('[data-open]');if(o)openPath(o.dataset.open);let d=e.target.closest('[data-del-inv]');if(d)delInv(d.dataset.delInv);if(e.target.closest('[data-export]'))exportCsv()});document.addEventListener('change',e=>{if(e.target.id==='pdfFile')onFile(e.target.files[0]);if(e.target.closest('#pdfForm')&&['net','vat','total'].includes(e.target.name))checkAmounts(e.target.form)});document.addEventListener('submit',e=>{if(e.target.id==='pdfForm'){e.preventDefault();savePdf(e.target)}});$('#menu').onclick=()=>$('.side').classList.toggle('open');$('#quick').onclick=()=>uploadForm('sale');$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};boot();
</script></body></html>
